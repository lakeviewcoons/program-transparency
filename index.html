<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Lake View cooNs house theme. Dark is the default (see <html data-theme>);
     this light block backs the toggle and is forced for print. */
  --title:"Cinzel Decorative","Cinzel","Trajan Pro","Iowan Old Style",Palatino,Georgia,serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --surface-0:#f6f8fa; --surface-1:#ffffff; --surface-2:#f2f5f8;
  --border:#dde5ec; --border-strong:#c7d3dd;
  --text-primary:#0f1b22; --text-secondary:#4a5b68; --text-muted:#78889a;
  --income:#1a8078; --expense:#2f6f9f; --net:#8a6d1f; --expense-bar:#94433a;
  --g-op:#2f6f9f; --g-cap:#8a6d1f; --g-fin:#8a5a8a; --g-tax:#a8524a;
  --pos:#1a8078; --neg:#b4544c;
  --c1:#1f6f66; --c2:#9a6b12; --c3:#35608f; --c4:#8a4f86; --c5:#4a7f2f; --c6:#b04a30;
  --c7:#6a5aa8; --c8:#8a7a1f; --c9:#2b8078; --c10:#a34a70; --c11:#5a6672; --c12:#8a5730;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --surface-0:#000000; --surface-1:#0a0f14; --surface-2:#101922;
  --border:#1b242d; --border-strong:#2a3742;
  --text-primary:#f2f6f8; --text-secondary:#93a3b0; --text-muted:#6f7f8b;
  --income:#3aab9e; --expense:#6f9ecf; --net:#c9a227; --expense-bar:#b8564e;
  --g-op:#3aab9e; --g-cap:#c9a227; --g-fin:#b07fb0; --g-tax:#d4736b;
  --pos:#3aab9e; --neg:#d4736b;
  --c1:#3aab9e; --c2:#e0a33a; --c3:#7fa8d9; --c4:#c98bc4; --c5:#8fc46b; --c6:#e07a5f;
  --c7:#b6a4e8; --c8:#d9c96b; --c9:#5ec8bf; --c10:#e08cae; --c11:#9aa7b4; --c12:#c4855c;
  --shadow:0 1px 3px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);
  background:var(--surface-0);color:var(--text-primary);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
a{color:var(--expense)}
header{position:sticky;top:0;z-index:20;background:var(--surface-1);border-bottom:1px solid var(--border);
  padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow)}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{margin:0;font-family:var(--title);font-size:27px;font-weight:400;letter-spacing:.045em;line-height:1.15}
.brand .sub{color:var(--text-muted);font-size:12px}
.spacer{flex:1}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;flex-wrap:wrap}
.tab{padding:7px 14px;border:none;background:transparent;color:var(--text-secondary);font-size:13px;font-weight:550;
  border-radius:7px;cursor:pointer;transition:.15s}
.tab:hover{color:var(--text-primary)}
.tab.active{background:var(--surface-1);color:var(--text-primary);box-shadow:var(--shadow)}
.icbtn{border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-secondary);
  width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:16px;display:grid;place-items:center}
.icbtn:hover{color:var(--text-primary)}
main{max-width:1200px;margin:0 auto;padding:22px}
.view{display:none;animation:fade .25s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .label{font-size:12.5px;color:var(--text-secondary);font-weight:700;letter-spacing:.04em}
.kpi .val{font-size:26px;font-weight:400;margin-top:6px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:12px;color:var(--text-secondary);margin-top:3px}
.kpi.pos .val{color:var(--pos)} .kpi.neg .val{color:var(--neg)}
.kpi.exp .val{color:var(--expense-bar)}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:20px;box-shadow:var(--shadow)}
.card h2{margin:0 0 2px;font-size:15px;font-weight:640}
.card .desc{color:var(--text-muted);font-size:12.5px;margin-bottom:14px}
.row{display:grid;gap:20px}
@media(min-width:860px){.row.two{grid-template-columns:1fr 1fr}}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:2px 0 12px;font-size:12.5px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:6px 12px;border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-secondary);
  border-radius:20px;cursor:pointer;font-size:12.5px;font-weight:550}
.chip.active{background:var(--expense);border-color:var(--expense);color:#fff}
select,input[type=search]{padding:8px 10px;border:1px solid var(--border-strong);background:var(--surface-1);
  color:var(--text-primary);border-radius:9px;font-size:13px;font-family:inherit}
input[type=search]{min-width:220px}
svg{display:block;width:100%;overflow:visible}
.axis text{fill:var(--text-muted);font-size:11px}
.axis line,.axis path{stroke:var(--border)}
.gridline{stroke:var(--border);stroke-dasharray:2 3;opacity:.7}
.bar{transition:opacity .12s} .bar:hover{opacity:.82}
.tt{position:fixed;pointer-events:none;z-index:50;background:var(--surface-1);border:1px solid var(--border-strong);
  border-radius:9px;padding:9px 11px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;max-width:260px}
.tt b{font-weight:650} .tt .r{display:flex;justify-content:space-between;gap:14px;margin-top:3px}
.tt .r .k{color:var(--text-secondary)} .tt .r .v{font-variant-numeric:tabular-nums;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
th{color:var(--text-muted);font-size:12px;letter-spacing:.03em;font-weight:600;
  cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface-1)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.pill.inc{background:color-mix(in srgb,var(--income) 18%,transparent);color:var(--income)}
.pill.exp{background:color-mix(in srgb,var(--expense) 18%,transparent);color:var(--expense)}
.tbl-wrap{max-height:560px;overflow:auto;border:1px solid var(--border);border-radius:12px}
.muted{color:var(--text-muted)} .mono{font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--text-muted);margin-top:8px}
.barlabel{fill:var(--text-secondary);font-size:11.5px;font-variant-numeric:tabular-nums}
.barname{fill:var(--text-primary);font-size:12px}
/* axis tick labels — used on every chart. Without this rule SVG <text> falls back to
   fill:black, i.e. black-on-black in dark mode (found 2026-08-10). */
.axtx{fill:var(--text-muted);font-size:11px;font-variant-numeric:tabular-nums}
/* Charts are a fixed 760-unit viewBox scaled to the container, so SVG text shrinks with the
   screen: at a 390px phone the container is ~315px, a scale of ~0.41, which renders an 11px
   label at ~4.5px. These breakpoints enlarge the text in user units so it lands ~10-11px
   on screen. (Tina flagged the Cost Control charts, 2026-08-10.) */
@media(max-width:700px){
  /* Chart text is drawn in a 760-unit viewBox that gets scaled down to the container, so
     it must be oversized here to land ~10-11px on screen. Values were still colliding at
     phone width when embedded, so labels are trimmed back and the cards given less padding
     to widen the drawing area (seen live on the Squarespace embed, 2026-08-10). */
  .axtx{font-size:21px}
  .barname{font-size:22px}
  .barlabel{font-size:21px}
  .card{padding:14px 10px 12px}
  .legend{gap:4px 10px}
}
@media(min-width:701px) and (max-width:859px){
  .axtx{font-size:14px}
  .barname{font-size:15px}
  .barlabel{font-size:14px}
}
/* --- phone layout & legibility pass (2026-08-10) --- */
@media(max-width:700px){
  /* body copy and small print up to comfortable reading sizes */
  body{font-size:15px}
  .card .desc{font-size:13.5px}
  .kpi .label{font-size:13px}
  .kpi .foot{font-size:12.5px}
  .kpi .val{font-size:23px}
  .note{font-size:13px}
  .legend{font-size:13px}
  .pill{font-size:12px}
  th{font-size:12.5px}
  table{font-size:13.5px}
  .brand .sub, header .brandwrap .brand .sub{font-size:12.5px}

  /* one chip per row instead of squeezing two into ~150px each */
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .two,.row.two,.g2,.g3{grid-template-columns:1fr}

  /* header: title shrinks, tabs and controls get room and real tap targets */
  header{padding:10px 14px;gap:10px}
  header .brandwrap{font-size:19px}
  /* Phone: the tab strip used to scroll horizontally, so only ~3 of 7 tabs were visible
     and nothing hinted the rest existed (Tina, 2026-08-11). Wrap them onto as many rows as
     needed instead — every tab is on screen. Header goes static so the taller strip does not
     eat the viewport. */
  header{position:static}
  .tabs{width:100%;flex-wrap:wrap;overflow:visible;gap:5px;justify-content:stretch}
  .tab{white-space:nowrap;padding:10px 8px;font-size:12.5px;flex:1 1 calc(50% - 5px);text-align:center}
  .icbtn,.lvc-btn,.vtoggle button{min-height:40px}
  .vtoggle button{padding:9px 12px;font-size:13px}

  /* wide tables scroll rather than crush */
  .tbl-wrap{max-height:none;overflow-x:auto}
  .wrap{padding:16px 14px 18px}
}
@media(max-width:400px){
  .kpis{grid-template-columns:1fr}
}

/* --- house controls: theme toggle + print --- */
@media print{
  :root, :root[data-theme="dark"]{
    --surface-0:#fff; --surface-1:#fff; --surface-2:#fff;
    --border:#ccc; --border-strong:#aaa;
    --text-primary:#111; --text-secondary:#444; --text-muted:#666;
    --income:#1a8078; --expense:#2f6f9f; --net:#8a6d1f; --expense-bar:#94433a;
    --g-op:#2f6f9f; --g-cap:#8a6d1f; --g-fin:#8a5a8a; --g-tax:#a8524a;
    --pos:#1a8078; --neg:#b4544c; --shadow:none; color-scheme:light;
    --c1:#1f6f66; --c2:#9a6b12; --c3:#35608f; --c4:#8a4f86; --c5:#4a7f2f; --c6:#b04a30;
    --c7:#6a5aa8; --c8:#8a7a1f; --c9:#2b8078; --c10:#a34a70; --c11:#5a6672; --c12:#8a5730;

  }
  body{background:#fff;color:#111}
  #theme,.tabs{display:none !important}
  header{position:static;border-bottom:1px solid #ccc}
  .view{display:block !important;break-inside:avoid}
}


.vtoggle{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:3px;gap:2px;margin-left:auto}
.vtoggle button{border:0;background:transparent;color:var(--text-muted);
  font:600 12.5px/1 var(--sans);padding:8px 12px;border-radius:8px;cursor:pointer}
.vtoggle button.on{background:var(--income);color:#fff}
body.buyer [data-priv]{display:none!important}
@media print{.vtoggle{display:none!important}}

/* --- brand mark: teal paw tile. House style — on every cattery document. --- */
.paw{width:1.909em;height:1.909em;border-radius:.545em;
  background:linear-gradient(135deg,var(--income),var(--g-op));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:.88em;
  flex:none;box-shadow:var(--shadow);line-height:1}
header .brandwrap{display:flex;gap:.5em;align-items:center;font-size:27px}
header .brandwrap .brand h1{font-size:1em}
header .brandwrap .brand .sub{font-size:12px}
</style>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s,r=document)=>r.querySelector(s);
const el=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k==='html')e.innerHTML=a[k];else e.setAttribute(k,a[k]);}c.flat().forEach(x=>e.append(x&&x.nodeType?x:document.createTextNode(x??'')));return e;};
const fmt=(n,d=0)=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtK=n=>{const a=Math.abs(n);if(a>=1000)return (n<0?'-':'')+'$'+(a/1000).toFixed(a>=10000?0:1)+'k';return fmt(n);};
const cssv=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();

/* ---------- tooltip ---------- */
const TT=$('#tt');
function tip(html,e){TT.innerHTML=html;TT.style.opacity=1;move(e);}
function move(e){const p=12;let x=e.clientX+p,y=e.clientY+p;const r=TT.getBoundingClientRect();
  if(x+r.width>innerWidth)x=e.clientX-r.width-p;if(y+r.height>innerHeight)y=e.clientY-r.height-p;TT.style.left=x+'px';TT.style.top=y+'px';}
function hide(){TT.style.opacity=0;}

/* ---------- SVG helpers ---------- */
const NS='http://www.w3.org/2000/svg';
function svg(w,h){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',`0 0 ${w} ${h}`);s.setAttribute('width','100%');s.style.height=h+'px';return s;}
function sn(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);return e;}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;let m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return m*p;}

/* grouped income/expense bars + net line, one $ axis (with negative region) */
function pnlChart(rows,netVar){netVar=netVar||'--net';
  const W=760,H=350,mL=56,mR=16,mT=16,mB=34,iw=W-mL-mR,ih=H-mT-mB;
  const s=svg(W,H);
  const maxV=niceMax(Math.max(...rows.map(r=>Math.max(r.income,r.expense))));
  const minNet=Math.min(0,...rows.map(r=>r.net));
  const minAxis=minNet<0?-niceMax(-minNet):0;
  const span=maxV-minAxis;
  const y=v=>mT+ih-((v-minAxis)/span)*ih;
  const ticks=6;for(let i=0;i<=ticks;i++){const v=minAxis+span*i/ticks;const yy=y(v);
    s.append(sn('line',{class:'gridline',x1:mL,x2:mL+iw,y1:yy,y2:yy}));
    s.append(Object.assign(sn('text',{class:'axtx',x:mL-8,y:yy+3,'text-anchor':'end'}),{textContent:fmtK(v)}));}
  const y0=y(0);
  s.append(sn('line',{x1:mL,x2:mL+iw,y1:y0,y2:y0,stroke:cssv('--border-strong'),'stroke-width':1.2}));
  const n=rows.length,bw=iw/n,pad=bw*0.16,gw=(bw-2*pad)/2;
  rows.forEach((r,i)=>{
    const x0=mL+i*bw+pad;
    [['income',r.income,cssv('--income')],['expense',r.expense,cssv('--expense-bar')]].forEach(([k,v,col],j)=>{
      const bh=Math.max(0,y0-y(v)),bx=x0+j*gw;
      const b=sn('rect',{class:'bar',x:bx,y:y(v),width:gw-2,height:bh,rx:3,fill:col});
      b.addEventListener('mousemove',e=>tip(`<b>${r.year}</b><div class=r><span class=k>Income</span><span class=v>${fmt(r.income)}</span></div><div class=r><span class=k>Expenses</span><span class=v>${fmt(r.expense)}</span></div><div class=r><span class=k>Net</span><span class=v style="color:${r.net<0?cssv('--neg'):cssv('--pos')}">${fmt(r.net)}</span></div>`,e));
      b.addEventListener('mouseleave',hide);s.append(b);
    });
    s.append(Object.assign(sn('text',{class:'axtx',x:x0+gw-1,y:H-mB+16,'text-anchor':'middle'}),{textContent:r.year}));
  });
  let dpath='';rows.forEach((r,i)=>{const cx=mL+i*bw+bw/2;const cy=y(r.net);dpath+=(i?'L':'M')+cx+' '+cy+' ';});
  s.append(sn('path',{d:dpath,fill:'none',stroke:cssv(netVar),'stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round','opacity':.95}));
  rows.forEach((r,i)=>{const cx=mL+i*bw+bw/2,cy=y(r.net);
    const c=sn('circle',{cx,cy,r:4.5,fill:cssv('--surface-1'),stroke:cssv(netVar),'stroke-width':2});
    c.addEventListener('mousemove',e=>tip(`<b>${r.year} net</b><div class=r><span class=k>Net</span><span class=v style="color:${r.net<0?cssv('--neg'):cssv('--pos')}">${fmt(r.net)}</span></div>`,e));
    c.addEventListener('mouseleave',hide);s.append(c);});
  return s;
}

/* monthly cumulative net line + income/expense area-ish bars */
function monthlyChart(rows){
  const W=760,H=300,mL=54,mR=16,mT=14,mB=40,iw=W-mL-mR,ih=H-mT-mB;
  const s=svg(W,H);
  let cum=0;const cumRows=rows.map(r=>{cum+=r.net;return {...r,cum};});
  const maxBar=60000;
  const cmin=Math.min(0,...cumRows.map(r=>r.cum)),cmax=Math.max(0,...cumRows.map(r=>r.cum));
  const y=v=>mT+ih-(v/maxBar)*ih;
  const ticks=6;for(let i=0;i<=ticks;i++){const v=maxBar*i/ticks,yy=y(v);
    s.append(sn('line',{class:'gridline',x1:mL,x2:mL+iw,y1:yy,y2:yy}));
    s.append(Object.assign(sn('text',{class:'axtx',x:mL-8,y:yy+3,'text-anchor':'end'}),{textContent:fmtK(v)}));}
  const n=rows.length,bw=iw/n;
  rows.forEach((r,i)=>{
    const x0=mL+i*bw+bw*0.5;
    // expense bar (thin), income overlaid thinner
    const ew=Math.min(6,bw*0.5);
    [['expense',r.expense,cssv('--expense-bar'),-ew-1],['income',r.income,cssv('--income'),1]].forEach(([k,v,col,off])=>{
      if(v<=0)return;const bh=(v/maxBar)*ih;
      const b=sn('rect',{class:'bar',x:x0+off,y:y(v),width:ew,height:bh,rx:2,fill:col,opacity:.9});
      b.addEventListener('mousemove',e=>tip(`<b>${r.month}</b><div class=r><span class=k>Income</span><span class=v>${fmt(r.income)}</span></div><div class=r><span class=k>Expenses</span><span class=v>${fmt(r.expense)}</span></div><div class=r><span class=k>Cumulative net</span><span class=v style="color:${r.cum<0?cssv('--neg'):cssv('--pos')}">${fmt(cumRows[i].cum)}</span></div>`,e));
      b.addEventListener('mouseleave',hide);s.append(b);
    });
  });
  // x labels: year starts, with spacing guard
  let lastX=-99;
  rows.forEach((r,i)=>{if(r.month.slice(5)==='01'){const cx=mL+i*bw+bw/2;if(cx-lastX<34)return;lastX=cx;
    s.append(Object.assign(sn('text',{class:'axtx',x:cx,y:H-mB+16,'text-anchor':'middle'}),{textContent:r.month.slice(0,4)}));}});
  return s;
}

/* horizontal bars for categories */
function hbars(rows,total,colorFn){
  /* Phone: the category name and the amount collide, because the name is drawn oversized to
     survive the viewBox downscale and the small bars at the end of the list leave no gap.
     Below 700px stack the name above its bar. (Tina, live 2026-08-10) */
  const narrow = window.innerWidth <= 700;
  const W=760, rowH = narrow?62:34, mT=6, mL=6, mR=14, labelW = narrow?0:190,
        H=rows.length*rowH+mT+6;
  const s=svg(W,H);
  const maxV=Math.max(...rows.map(r=>r.amount));
  const bx=mL+labelW,bw=W-bx-mR-70;
  const gcol={Operating:'--g-op',Capital:'--g-cap',Financing:'--g-fin',Taxes:'--g-tax'};
  rows.forEach((r,i)=>{
    const yy=mT+i*rowH;
    s.append(Object.assign(sn('text',{class:'barname',x:mL,y:narrow?yy+20:yy+rowH/2+4}),{textContent:r.category}));
    const w=Math.max(2,(r.amount/maxV)*bw);const col=cssv(colorFn?colorFn(r):(gcol[r.group]||'--g-op'));
    const b=sn('rect',{class:'bar',x:bx,y:narrow?yy+30:yy+6,width:w,height:narrow?20:rowH-14,rx:4,fill:col});
    b.addEventListener('mousemove',e=>tip(`<b>${r.category}</b><div class=r><span class=k>${r.group}</span><span class=v>${fmt(r.amount)}</span></div><div class=r><span class=k>Share</span><span class=v>${(r.amount/total*100).toFixed(1)}%</span></div>`,e));
    b.addEventListener('mouseleave',hide);s.append(b);
    s.append(Object.assign(sn('text',{class:'barlabel',x:bx+w+8,y:narrow?yy+46:yy+rowH/2+4}),{textContent:fmt(r.amount)}));
  });
  return s;
}

/* stacked bars by year for groups */
function stackByYear(){
  const groups=['Operating','Capital','Financing'];
  const gcol={Operating:'--g-op',Capital:'--g-cap',Financing:'--g-fin',Taxes:'--g-tax'};
  const byYear={};D.exp_cat_year.forEach(r=>{});
  // build from tx groups
  const yrs=D.pnl_yearly.map(r=>r.year);
  const map={};yrs.forEach(y=>map[y]={Operating:0,Capital:0,Financing:0,Taxes:0});
  D.tx.filter(t=>t.dir==='Expense').forEach(t=>{const y=t.date.slice(0,4);if(map[y])map[y][t.group]+=t.amount;});
  const W=760,H=320,mL=54,mR=16,mT=14,mB=34,iw=W-mL-mR,ih=H-mT-mB;
  const s=svg(W,H);
  const totals=yrs.map(y=>groups.reduce((a,g)=>a+map[y][g],0));
  const maxV=niceMax(Math.max(...totals));
  const y=v=>mT+ih-(v/maxV)*ih;
  for(let i=0;i<=4;i++){const v=maxV*i/4,yy=y(v);s.append(sn('line',{class:'gridline',x1:mL,x2:mL+iw,y1:yy,y2:yy}));
    s.append(Object.assign(sn('text',{class:'axtx',x:mL-8,y:yy+3,'text-anchor':'end'}),{textContent:fmtK(v)}));}
  const n=yrs.length,bw=iw/n,w=bw*0.56;
  yrs.forEach((yr,i)=>{let acc=0;const x0=mL+i*bw+(bw-w)/2;
    groups.forEach(g=>{const v=map[yr][g];if(v<=0)return;const bh=(v/maxV)*ih;const yTop=y(acc+v);
      const b=sn('rect',{class:'bar',x:x0,y:yTop,width:w,height:Math.max(0,bh-1.5),rx:2,fill:cssv(gcol[g])});
      b.addEventListener('mousemove',e=>tip(`<b>${yr} · ${g}</b><div class=r><span class=k>Amount</span><span class=v>${fmt(v)}</span></div><div class=r><span class=k>Year total</span><span class=v>${fmt(totals[i])}</span></div>`,e));
      b.addEventListener('mouseleave',hide);s.append(b);acc+=v;});
    s.append(Object.assign(sn('text',{class:'axtx',x:x0+w/2,y:H-mB+16,'text-anchor':'middle'}),{textContent:yr}));
  });
  return s;
}

/* revenue by year bars + kitten count */
function kittenYearChart(){
  const rows=D.income_year;const W=760,H=300,mL=54,mR=40,mT=16,mB=34,iw=W-mL-mR,ih=H-mT-mB;
  const s=svg(W,H);const maxV=niceMax(Math.max(...rows.map(r=>r.amount)));
  const y=v=>mT+ih-(v/maxV)*ih;
  for(let i=0;i<=4;i++){const v=maxV*i/4,yy=y(v);s.append(sn('line',{class:'gridline',x1:mL,x2:mL+iw,y1:yy,y2:yy}));
    s.append(Object.assign(sn('text',{class:'axtx',x:mL-8,y:yy+3,'text-anchor':'end'}),{textContent:fmtK(v)}));}
  const n=rows.length,bw=iw/n,w=bw*0.5;
  rows.forEach((r,i)=>{const x0=mL+i*bw+(bw-w)/2;const bh=(r.amount/maxV)*ih;
    const b=sn('rect',{class:'bar',x:x0,y:y(r.amount),width:w,height:bh,rx:3,fill:cssv('--income')});
    const avg=r.kittens?r.amount/r.kittens:0;
    b.addEventListener('mousemove',e=>tip(`<b>${r.year}</b><div class=r><span class=k>Revenue</span><span class=v>${fmt(r.amount)}</span></div><div class=r><span class=k>Kittens sold</span><span class=v>${r.kittens}</span></div><div class=r><span class=k>Avg / kitten</span><span class=v>${fmt(avg)}</span></div>`,e));

/* stacked reconciliation: itemized (solid) + unallocated (muted) = ledger, per year */
function vetReconChart(rows){
  const W=760,H=330,mL=56,mR=16,mT=18,mB=34,iw=W-mL-mR,ih=H-mT-mB;
  const s=svg(W,H);
  const maxV=niceMax(Math.max(...rows.map(r=>r.ledger)));
  const y=v=>mT+ih-(v/maxV)*ih;
  for(let i=0;i<=5;i++){const v=maxV*i/5,yy=y(v);s.append(sn('line',{class:'gridline',x1:mL,x2:mL+iw,y1:yy,y2:yy}));
    s.append(Object.assign(sn('text',{class:'axtx',x:mL-8,y:yy+3,'text-anchor':'end'}),{textContent:fmtK(v)}));}
  const n=rows.length,bw=iw/n,w=bw*0.56;
  const cItm=cssv('--g-op'),cUn=cssv('--border-strong');
  rows.forEach((r,i)=>{const x0=mL+i*bw+(bw-w)/2;
    const hItm=(r.itemized/maxV)*ih, hUn=(r.unallocated/maxV)*ih;
    const yItmTop=y(r.itemized), yUnTop=y(r.ledger);
    const tt=e=>tip(`<b>${r.year}</b><div class=r><span class=k>Ledger (all vet)</span><span class=v>${fmt(r.ledger)}</span></div><div class=r><span class=k>Itemized</span><span class=v>${fmt(r.itemized)}</span></div><div class=r><span class=k>Still lumped</span><span class=v>${fmt(r.unallocated)}</span></div><div class=r><span class=k>% known</span><span class=v>${r.pct}%</span></div>`,e);
    const bU=sn('rect',{class:'bar',x:x0,y:yUnTop,width:w,height:Math.max(0,hUn),rx:2,fill:cUn,opacity:.55});
    const bI=sn('rect',{class:'bar',x:x0,y:yItmTop,width:w,height:Math.max(0,hItm-1),rx:2,fill:cItm});
    [bU,bI].forEach(b=>{b.addEventListener('mousemove',tt);b.addEventListener('mouseleave',hide);s.append(b);});
    s.append(Object.assign(sn('text',{class:'barlabel',x:x0+w/2,y:yUnTop-6,'text-anchor':'middle'}),{textContent:r.pct+'%'}));
    s.append(Object.assign(sn('text',{class:'axtx',x:x0+w/2,y:H-mB+16,'text-anchor':'middle'}),{textContent:r.year}));
  });
  return s;
}

/* ================= FOOD & NUTRITION ================= */
const FVENDCOL={Amazon:'--c3',Chewy:'--c1','Hare Today':'--c2',Supplements:'--c7',Other:'--c11'};
const FFORMCOL={wet:'--c1',raw:'--c2',kibble:'--c3',raw_freezedried:'--c5',treat:'--c6',supplement:'--c11'};

/* stacked bars by year; rows:[{year,key,amount}], order[], colorFn(key)->cssvar.
   opts:{maxV,tickStep} pins the $ axis (else auto). */
function foodStack(rows,order,colorFn,nameFn,opts){opts=opts||{};
  const years=[...new Set(rows.map(r=>r.year))].sort();
  const m={};years.forEach(y=>m[y]={});rows.forEach(r=>{m[r.year][r.key]=(m[r.year][r.key]||0)+r.amount;});
  const totals=years.map(y=>order.reduce((a,k)=>a+(m[y][k]||0),0));
  const W=760,H=340,mL=56,mR=16,mT=18,mB=34,iw=W-mL-mR,ih=H-mT-mB;
  const s=svg(W,H);const maxV=opts.maxV||niceMax(Math.max(...totals));
  const step=opts.tickStep||maxV/5;
  const y=v=>mT+ih-(v/maxV)*ih;
  for(let val=0;val<=maxV+0.5;val+=step){const yy=y(val);s.append(sn('line',{class:'gridline',x1:mL,x2:mL+iw,y1:yy,y2:yy}));
    s.append(Object.assign(sn('text',{class:'axtx',x:mL-8,y:yy+3,'text-anchor':'end'}),{textContent:fmtK(val)}));}
  const n=years.length,bw=iw/n,w=Math.min(bw*0.6,64);
  years.forEach((yr,i)=>{let acc=0;const x0=mL+i*bw+(bw-w)/2;
    order.forEach(k=>{const v=m[yr][k]||0;if(v<=0)return;const bh=(v/maxV)*ih,yTop=y(acc+v);
      const b=sn('rect',{class:'bar',x:x0,y:yTop,width:w,height:Math.max(0,bh-1.2),rx:2,fill:cssv(colorFn(k))});
      b.addEventListener('mousemove',e=>tip(`<b>${yr} · ${nameFn(k)}</b><div class=r><span class=k>Spend</span><span class=v>${fmt(v)}</span></div><div class=r><span class=k>Year total</span><span class=v>${fmt(totals[i])}</span></div><div class=r><span class=k>Share</span><span class=v>${(v/totals[i]*100).toFixed(0)}%</span></div>`,e));
      b.addEventListener('mouseleave',hide);s.append(b);acc+=v;});
    s.append(Object.assign(sn('text',{class:'axtx',x:x0+w/2,y:H-mB+16,'text-anchor':'middle'}),{textContent:yr}));
    s.append(Object.assign(sn('text',{class:'barlabel',x:x0+w/2,y:y(totals[i])-6,'text-anchor':'middle'}),{textContent:fmtK(totals[i])}));
  });
  return s;
}

/* grouped (clustered) bars by year — every series is its own bar so all are hoverable,
   incl. tiny ones (a full-height transparent hit-area sits behind each). */
function foodGrouped(rows,order,colorFn,nameFn){
  const years=[...new Set(rows.map(r=>r.year))].sort();
  const m={};years.forEach(y=>m[y]={});rows.forEach(r=>{m[r.year][r.key]=(m[r.year][r.key]||0)+r.amount;});
  const series=order.filter(k=>years.some(y=>(m[y][k]||0)>0));
  const W=760,H=340,mL=56,mR=16,mT=18,mB=34,iw=W-mL-mR,ih=H-mT-mB;
  const s=svg(W,H);
  /* Axis fitted to the data, not rounded up to the next big number (Tina 2026-08-11).
     niceMax() alone took a $13.2k tallest bar up to a $20k ceiling, so the chart carried a
     dead 20k gridline and a third of its height was empty. Pick a round STEP off the data
     first, then stop at the first multiple of it that clears the tallest bar. */
  const maxData=Math.max(...years.flatMap(y=>series.map(k=>m[y][k]||0)),1);
  const step=niceMax(maxData/4);
  const maxV=Math.ceil(maxData/step)*step, nT=Math.max(1,Math.round(maxV/step));
  const y=v=>mT+ih-(v/maxV)*ih;
  for(let i=0;i<=nT;i++){const val=step*i,yy=y(val);s.append(sn('line',{class:'gridline',x1:mL,x2:mL+iw,y1:yy,y2:yy}));
    s.append(Object.assign(sn('text',{class:'axtx',x:mL-8,y:yy+3,'text-anchor':'end'}),{textContent:fmtK(val)}));}
  const n=years.length,bw=iw/n,cl=Math.min(bw*0.84,series.length*30),sw=cl/series.length;
  years.forEach((yr,i)=>{const x0=mL+i*bw+(bw-cl)/2;
    series.forEach((k,j)=>{const v=m[yr][k]||0;if(v<=0)return;const bx=x0+j*sw;
      const tt=e=>tip(`<b>${yr} · ${nameFn(k)}</b><div class=r><span class=k>Spend</span><span class=v>${fmt(v)}</span></div>`,e);
      const hit=sn('rect',{x:bx,y:mT,width:sw,height:ih,fill:'transparent','pointer-events':'all'});
      hit.addEventListener('mousemove',tt);hit.addEventListener('mouseleave',hide);s.append(hit);
      const b=sn('rect',{class:'bar',x:bx+1.5,y:y(v),width:Math.max(2,sw-3),height:Math.max(2,(v/maxV)*ih),rx:2,fill:cssv(colorFn(k))});
      b.addEventListener('mousemove',tt);b.addEventListener('mouseleave',hide);s.append(b);
    });
    s.append(Object.assign(sn('text',{class:'axtx',x:mL+i*bw+bw/2,y:H-mB+16,'text-anchor':'middle'}),{textContent:yr}));
  });
  return s;
}

/* horizontal value bars sorted by a rate; rows already sorted, rate in r[rateKey] */
function valueBars(rows,rateKey,rateFmt,nameFn,colorFn,subFn){
  const W=760,rowH=30,mT=6,mL=6,mR=14,labelW=150,H=rows.length*rowH+mT+6;
  const s=svg(W,H);const maxV=Math.max(...rows.map(r=>r[rateKey]))||1;
  const bx=mL+labelW,bw=W-bx-mR-150;
  rows.forEach((r,i)=>{const yy=mT+i*rowH;
    s.append(Object.assign(sn('text',{class:'barname',x:mL,y:yy+rowH/2+4}),{textContent:nameFn(r)}));
    const w=Math.max(2,(r[rateKey]/maxV)*bw);const col=cssv(colorFn?colorFn(r):'--g-op');
    const b=sn('rect',{class:'bar',x:bx,y:yy+5,width:w,height:rowH-12,rx:4,fill:col});
    b.addEventListener('mousemove',e=>tip(`<b>${nameFn(r)}</b><div class=r><span class=k>${rateKey==='per_oz'?'$/oz':'$/lb'}</span><span class=v>${rateFmt(r[rateKey])}</span></div>${subFn?subFn(r):''}`,e));
    b.addEventListener('mouseleave',hide);s.append(b);
    s.append(Object.assign(sn('text',{class:'barlabel',x:bx+w+8,y:yy+rowH/2+4}),{textContent:rateFmt(r[rateKey])+'  ·  '+fmt(r.spend)}));
  });
  return s;
}

const CATRAMP=['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8','--c9','--c10','--c11','--c12'];
function catColor(keys,key,offset){const i=keys.indexOf(key);
  return CATRAMP[((i<0?0:i)+(offset||0))%CATRAMP.length];}

<script>
/* report height to the embedding page (Squarespace iframe) */
(function(){
  if (window.parent === window) return;          // not embedded — do nothing
  var last = 0;
  function contentHeight(){
    /* Measure the CONTENT, not the viewport. body.scrollHeight is at least the viewport
       height, so once the parent grows the iframe the body fills it and reports the larger
       number back — a ratchet that only ever grows, leaving dead space below the charts. */
    var b = 0;
    for (var i = 0; i < document.body.children.length; i++){
      var r = document.body.children[i].getBoundingClientRect();
      if (r.bottom > b) b = r.bottom;
    }
    return Math.ceil(b + window.scrollY);
  }
  function post(){
    var h = contentHeight();
    if (Math.abs(h - last) > 8){ last = h; parent.postMessage({lvcHeight: h}, '*'); }
  }
  window.addEventListener('load', post);
  window.addEventListener('resize', post);
  new MutationObserver(post).observe(document.body, {subtree:true, childList:true});
  setInterval(post, 1000);
})();
</script>
